name: netzplaner

services:
  netzplaner:
    image: netzplaner:1.3.0
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      SCAN_ALLOWED_CIDRS: "${SCAN_ALLOWED_CIDRS:-}"
      SCAN_TOKEN: "${SCAN_TOKEN:-}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
